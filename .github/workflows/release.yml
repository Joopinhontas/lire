name: Release image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Image starts before it is published
        run: |
          docker build -t lire:check .
          docker run -d --name lire-check -p 8160:8160 \
            -e PROWLARR_URL=http://127.0.0.1:9 -e PROWLARR_API_KEY=ci -e QBIT_URL=http://127.0.0.1:9 \
            -e QBIT_USER=ci -e QBIT_PASSWORD=ci -e KAVITA_URL=http://127.0.0.1:9 -e KAVITA_API_KEY=ci \
            -e LIRE_PASSWORD=ci-password -e SESSION_SECRET=$(openssl rand -hex 32) lire:check
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8160/healthz && exit 0; sleep 1; done
          docker logs lire-check; exit 1
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
