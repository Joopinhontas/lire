name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pip-audit ruff
      - run: ruff check app tests --select F,E9
      - run: pytest -q
      - run: pip-audit -r requirements.txt
      - run: node --check app/static/app.js && node --check app/static/i18n.js
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lire:ci .
      - name: Container starts and answers
        run: |
          docker run -d --name lire-ci -p 8160:8160 \
            -e PROWLARR_URL=http://127.0.0.1:9 -e PROWLARR_API_KEY=ci -e QBIT_URL=http://127.0.0.1:9 \
            -e QBIT_USER=ci -e QBIT_PASSWORD=ci -e KAVITA_URL=http://127.0.0.1:9 -e KAVITA_API_KEY=ci \
            -e LIRE_PASSWORD=ci-password -e SESSION_SECRET=$(openssl rand -hex 32) lire:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8160/healthz && exit 0; sleep 1; done
          docker logs lire-ci; exit 1
